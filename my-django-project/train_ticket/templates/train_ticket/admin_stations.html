{% extends 'train_ticket/base.html' %}{% block content %}<h2 class="mt-4">📍 จัดการสถานี</h2><div class="form-card"><form method="post">{% csrf_token %}<input type="hidden" name="id" value="{{edit.id|default:''}}"><input class="form-control mb-2" name="name" value="{{edit.name|default:''}}" placeholder="ชื่อสถานี" required><input class="form-control mb-2" name="province" value="{{edit.province|default:''}}" placeholder="จังหวัด" required><button class="btn btn-primary">บันทึก</button></form></div><table class="table table-bordered bg-white"><tr><th>ID</th><th>สถานี</th><th>จังหวัด</th><th>จัดการ</th></tr>{% for o in objects %}<tr><td>{{o.id}}</td><td>{{o.name}}</td><td>{{o.province}}</td><td><a href="?edit={{o.id}}">แก้ไข</a> | <a href="?delete={{o.id}}">ลบ</a></td></tr>{% endfor %}</table>{% endblock %}
