{% extends 'train_ticket/base.html' %}{% block content %}<h2 class="mt-4">🚆 จัดการขบวนรถ</h2><div class="form-card"><form method="post">{% csrf_token %}<input type="hidden" name="id" value="{{edit.id|default:''}}"><input class="form-control mb-2" name="train_number" value="{{edit.train_number|default:''}}" placeholder="Train number" required><input class="form-control mb-2" name="type" value="{{edit.type|default:''}}" placeholder="Type" required><button class="btn btn-primary">บันทึก</button></form></div><table class="table table-bordered bg-white"><tr><th>ID</th><th>ขบวน</th><th>ประเภท</th><th>จัดการ</th></tr>{% for o in objects %}<tr><td>{{o.id}}</td><td>{{o.train_number}}</td><td>{{o.type}}</td><td><a href="?edit={{o.id}}">แก้ไข</a> | <a href="?delete={{o.id}}">ลบ</a></td></tr>{% endfor %}</table>{% endblock %}
