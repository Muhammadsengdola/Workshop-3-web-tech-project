{% extends 'train_ticket/base.html' %}{% block content %}<h2 class="mt-4">🗓️ จัดการตารางเวลา</h2><div class="form-card"><form method="post">{% csrf_token %}<input type="hidden" name="id" value="{{edit.id|default:''}}"><select name="train_id" class="form-select mb-2" required>{% for t in trains %}<option value="{{t.id}}">{{t.train_number}}</option>{% endfor %}</select><select name="origin_id" class="form-select mb-2" required>{% for s in stations %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select><select name="destination_id" class="form-select mb-2" required>{% for s in stations %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select><input class="form-control mb-2" type="date" name="travel_date" value="{{edit.travel_date|date:'Y-m-d'}}" required><input class="form-control mb-2" type="time" name="departure_time" value="{{edit.departure_time|time:'H:i'}}" required><input class="form-control mb-2" type="time" name="arrival_time" value="{{edit.arrival_time|time:'H:i'}}" required><button class="btn btn-primary">บันทึก</button></form></div><table class="table table-bordered bg-white"><tr><th>ID</th><th>ขบวน</th><th>เส้นทาง</th><th>วันที่</th><th>จัดการ</th></tr>{% for o in objects %}<tr><td>{{o.id}}</td><td>{{o.train}}</td><td>{{o.origin}} → {{o.destination}}</td><td>{{o.travel_date}}</td><td><a href="?edit={{o.id}}">แก้ไข</a> | <a href="?delete={{o.id}}">ลบ</a></td></tr>{% endfor %}</table>{% endblock %}
